esphome:
  name: clima-samsung
  friendly_name: "Clima samsung"

external_components:
  - source: github://mansellrace/esphome-samsung-climate-ir@main
    components: [samsung_climate_ir]

esp8266:
  board: d1_mini

logger:

api:
  encryption:
    key: # INSERISCI QUI LA TUA API KEY

ota:
  - platform: esphome
    password: # INSERISCI QUI LA TUA OTA PASSWORD

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

captive_portal:

# Uscita del ricevitore IR del climatizzatore: attiva bassa, quindi inverted.
# idle deve stare sopra i 18 ms perche' la trama Samsung contiene una pausa di
# 17.8 ms subito dopo l'header: con il default di 10 ms verrebbe spezzata in due.
remote_receiver:
  id: ir_rx
  pin:
    number: D6
    inverted: true
  tolerance: 40%
  idle: 25ms

# carrier_duty_percent: 100% = nessuna portante a 38 kHz, il mark e' un livello
# alto pieno. E' cio' che serve iniettando il segnale gia' demodulato sul filo
# del sensore IR. Il transistor sulla scheda continua a invertire il pin.
remote_transmitter:
  id: ir_tx
  pin: D7
  carrier_duty_percent: 100%

sensor:
  - platform: homeassistant
    name: "Temperatura"
    entity_id: sensor.temperatura # INSERISCI QUI IL TUO SENSORE DI TEMPERATURA AMBIENTALE
    id: temp_attuale

climate:
  - platform: samsung_climate_ir
    id: clima
    name: ""
    receiver_id: ir_rx
    transmitter_id: ir_tx
    sensor: temp_attuale
    # Togli questo blocco per usare i fan mode standard di ESPHome
    # (auto / quiet / low / medium / high + il custom "Turbo").
    fan_mode_names:
      quiet: "Quiet"
      low: "Velocità 1"
      medium: "Velocità 2"
      high: "Velocità 3"
      turbo: "Velocità 4"

# Commuta il beep del climatizzatore. Vedi il README: sui modelli piu' vecchi
# potrebbe non fare nulla.
button:
  - platform: samsung_climate_ir
    samsung_climate_ir_id: clima
    name: "Beep"
